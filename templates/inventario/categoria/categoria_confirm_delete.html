{% extends "dashboard.html" %}
{% block titulo %}Eliminar Categoría{% endblock titulo %}

{% block section2 %}
<div class="d-flex justify-content-center align-items-center" style="height: 80vh;">
    <div class="card shadow" style="width: 400px;">
        <div class="card-body text-center">
            <h3 class="card-title mb-4">Eliminar Categoría</h3>
            <p>¿Estás seguro de que deseas eliminar la categoría <strong>{{ object.nombre }}</strong>?</p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center align-items-center gap-2 mt-4">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Eliminar
                    </button>
                    <a href="{% url 'categoria_list' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
